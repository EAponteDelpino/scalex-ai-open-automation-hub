<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScaleX AI | Cuenta regresiva verificable</title>
<!-- Demo: when pasted in GHL, include assets/scalex.css and assets/scalex.js first -->
<style>.sx-widget{font:16px/1.5 system-ui,sans-serif;--sx-primary:#1479e6;--sx-ink:#17243b;--sx-border:#ced8e3;color:var(--sx-ink);max-width:720px;margin:auto}.sx-widget *{box-sizing:border-box}.sx-card{border:1px solid var(--sx-border);border-radius:12px;padding:20px;margin:12px 0}.sx-btn{background:var(--sx-primary);color:white;border:0;border-radius:9px;padding:12px 17px;cursor:pointer;font:inherit}.sx-btn:disabled{opacity:.5;cursor:not-allowed}input,select{font:inherit;padding:9px;max-width:100%}label{display:block;margin:8px 0}a{color:var(--sx-primary)}:focus-visible{outline:3px solid #06b6d4;outline-offset:3px}</style>
</head><body><main class="sx-widget"><h1>Cuenta regresiva verificable</h1><section class="sx-card"><p>Este contador debe apuntar a una fecha real. No se reinicia automáticamente.</p><p><strong id="sx-time" role="timer">Configura una fecha</strong></p><p><small>Define <code>deadlineISO</code> usando una fecha con zona horaria.</small></p></section></main><script>\n(function(){const deadlineISO='2027-12-31T23:59:00-05:00',target=Date.parse(deadlineISO),out=document.getElementById('sx-time');function tick(){if(!Number.isFinite(target)){out.textContent='Fecha inválida';return;}const ms=Math.max(0,target-Date.now()),days=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);out.textContent=ms===0?'Plazo finalizado':days+' días, '+h+' h, '+m+' min, '+s+' s';if(ms===0)clearInterval(timer);}tick();const timer=setInterval(tick,1000);})();\n</script></body></html>
