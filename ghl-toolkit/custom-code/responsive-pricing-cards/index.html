<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScaleX AI | Tarjetas de precios responsive</title>
<!-- Demo: when pasted in GHL, include assets/scalex.css and assets/scalex.js first -->
<style>.sx-widget{font:16px/1.5 system-ui,sans-serif;--sx-primary:#1479e6;--sx-ink:#17243b;--sx-border:#ced8e3;color:var(--sx-ink);max-width:720px;margin:auto}.sx-widget *{box-sizing:border-box}.sx-card{border:1px solid var(--sx-border);border-radius:12px;padding:20px;margin:12px 0}.sx-btn{background:var(--sx-primary);color:white;border:0;border-radius:9px;padding:12px 17px;cursor:pointer;font:inherit}.sx-btn:disabled{opacity:.5;cursor:not-allowed}input,select{font:inherit;padding:9px;max-width:100%}label{display:block;margin:8px 0}a{color:var(--sx-primary)}:focus-visible{outline:3px solid #06b6d4;outline-offset:3px}</style>
</head><body><main class="sx-widget"><h1>Tarjetas de precios responsive</h1><section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1rem"><article class="sx-card"><h2>Inicial</h2><strong>59.000 COP</strong><p>1 especialidad</p><a class="sx-btn" href="#contacto">Elegir</a></article><article class="sx-card"><h2>Profesional</h2><strong>99.900 COP</strong><p>3 especialidades</p><a class="sx-btn" href="#contacto">Elegir</a></article></section><section id="contacto" class="sx-card"><p>Vincula cada CTA al paso y plan real de tu embudo.</p></section></main></body></html>
