<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScaleX AI | Selector dinámico de planes</title>
<!-- Demo: when pasted in GHL, include assets/scalex.css and assets/scalex.js first -->
<style>.sx-widget{font:16px/1.5 system-ui,sans-serif;--sx-primary:#1479e6;--sx-ink:#17243b;--sx-border:#ced8e3;color:var(--sx-ink);max-width:720px;margin:auto}.sx-widget *{box-sizing:border-box}.sx-card{border:1px solid var(--sx-border);border-radius:12px;padding:20px;margin:12px 0}.sx-btn{background:var(--sx-primary);color:white;border:0;border-radius:9px;padding:12px 17px;cursor:pointer;font:inherit}.sx-btn:disabled{opacity:.5;cursor:not-allowed}input,select{font:inherit;padding:9px;max-width:100%}label{display:block;margin:8px 0}a{color:var(--sx-primary)}:focus-visible{outline:3px solid #06b6d4;outline-offset:3px}</style>
</head><body><main class="sx-widget"><h1>Selector dinámico de planes</h1><section class="sx-card" id="sx-plans"><p>Elige una especialidad (valores de ejemplo).</p><label for="sx-plan">Plan</label><select id="sx-plan"><option value="basic">Una especialidad — 59.000 COP</option><option value="double">Dos especialidades — 79.900 COP</option><option value="triple">Tres especialidades — 99.900 COP</option></select><p>Total: <output id="sx-total" aria-live="polite"></output></p><input type="hidden" id="sx-plan-id" name="selected_plan" value="basic"><input type="hidden" id="sx-amount" name="selected_amount" value="59000"><small>Ejemplo demostrativo: enlaza estos valores a un formulario GHL real y confirma precios en servidor.</small></section></main><script>
(function(){const prices={basic:59000,double:79900,triple:99900},s=document.getElementById('sx-plan'),o=document.getElementById('sx-total');function update(){const key=s.value,amount=prices[key];o.textContent=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(amount);document.getElementById('sx-plan-id').value=key;document.getElementById('sx-amount').value=amount;}s.addEventListener('change',update);update();})();
</script></body></html>
