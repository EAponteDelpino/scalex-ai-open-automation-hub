<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScaleX AI | Checkout multimoneda</title>
<!-- Demo: when pasted in GHL, include assets/scalex.css and assets/scalex.js first -->
<style>.sx-widget{font:16px/1.5 system-ui,sans-serif;--sx-primary:#1479e6;--sx-ink:#17243b;--sx-border:#ced8e3;color:var(--sx-ink);max-width:720px;margin:auto}.sx-widget *{box-sizing:border-box}.sx-card{border:1px solid var(--sx-border);border-radius:12px;padding:20px;margin:12px 0}.sx-btn{background:var(--sx-primary);color:white;border:0;border-radius:9px;padding:12px 17px;cursor:pointer;font:inherit}.sx-btn:disabled{opacity:.5;cursor:not-allowed}input,select{font:inherit;padding:9px;max-width:100%}label{display:block;margin:8px 0}a{color:var(--sx-primary)}:focus-visible{outline:3px solid #06b6d4;outline-offset:3px}</style>
</head><body><main class="sx-widget"><h1>Checkout multimoneda</h1><section class="sx-card"><label for="sx-country">País</label><select id="sx-country"><option value="CO">Colombia (COP)</option><option value="EC">Ecuador (USD)</option></select><p id="sx-price" aria-live="polite"></p><button class="sx-btn" id="sx-go">Continuar al pago de prueba</button><p><small>Los enlaces y precios son solo ejemplos. No convertir monedas con una tasa implícita: cada país necesita su precio configurado.</small></p></section></main><script>\n(function(){const plans={CO:{amount:99000,currency:'COP',locale:'es-CO',checkout:'https://example.com/checkout-colombia'},EC:{amount:29.90,currency:'USD',locale:'es-EC',checkout:'https://example.com/checkout-ecuador'}};const select=document.getElementById('sx-country'),p=document.getElementById('sx-price');function refresh(){const x=plans[select.value];p.textContent=new Intl.NumberFormat(x.locale,{style:'currency',currency:x.currency,maximumFractionDigits:x.currency==='COP'?0:2}).format(x.amount);}select.addEventListener('change',refresh);document.getElementById('sx-go').addEventListener('click',()=>{const u=new URL(plans[select.value].checkout);if(u.protocol!=='https:'||u.hostname==='example.com'){alert('Configure el enlace de pago real HTTPS antes de continuar.');return;}location.assign(u.href);});refresh();})();\n</script></body></html>
