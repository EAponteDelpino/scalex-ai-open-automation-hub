<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScaleX AI | Mapeo de campos personalizados</title>
<!-- Demo: when pasted in GHL, include assets/scalex.css and assets/scalex.js first -->
<style>.sx-widget{font:16px/1.5 system-ui,sans-serif;--sx-primary:#1479e6;--sx-ink:#17243b;--sx-border:#ced8e3;color:var(--sx-ink);max-width:720px;margin:auto}.sx-widget *{box-sizing:border-box}.sx-card{border:1px solid var(--sx-border);border-radius:12px;padding:20px;margin:12px 0}.sx-btn{background:var(--sx-primary);color:white;border:0;border-radius:9px;padding:12px 17px;cursor:pointer;font:inherit}.sx-btn:disabled{opacity:.5;cursor:not-allowed}input,select{font:inherit;padding:9px;max-width:100%}label{display:block;margin:8px 0}a{color:var(--sx-primary)}:focus-visible{outline:3px solid #06b6d4;outline-offset:3px}</style>
</head><body><main class="sx-widget"><h1>Mapeo de campos personalizados</h1><section class="sx-card"><p>Ejemplo: sincroniza los datos visibles con inputs <code>hidden</code> dentro de <strong>tu propio formulario</strong>. En GHL deberás reemplazar los nombres <code>custom_plan</code> y <code>custom_country</code> por las claves correctas de tus campos, y verificar que el formulario nativo los acepte.</p><form id="sx-form"><label>Plan <select id="sx-plan"><option value="ai">IA</option><option value="commerce">Ecommerce</option></select></label><label>País <select id="sx-country"><option value="CO">Colombia</option><option value="EC">Ecuador</option></select></label><input type="hidden" name="custom_plan" id="sx-field-plan"><input type="hidden" name="custom_country" id="sx-field-country"><button class="sx-btn">Mostrar valores mapeados (demo)</button></form><pre id="sx-result" aria-live="polite"></pre></section></main><script>
(function(){const form=document.getElementById('sx-form');function sync(){form.elements.custom_plan.value=form.elements['sx-plan'].value;form.elements.custom_country.value=form.elements['sx-country'].value;}form.addEventListener('change',sync);form.addEventListener('submit',e=>{e.preventDefault();sync();document.getElementById('sx-result').textContent=JSON.stringify({plan:form.elements.custom_plan.value,country:form.elements.custom_country.value},null,2);});sync();})();
</script></body></html>
