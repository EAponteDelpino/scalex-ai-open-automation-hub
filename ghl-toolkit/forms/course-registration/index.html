<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScaleX AI | Preinscripción a cursos</title>
<!-- Demo: when pasted in GHL, include assets/scalex.css and assets/scalex.js first -->
<style>.sx-widget{font:16px/1.5 system-ui,sans-serif;--sx-primary:#1479e6;--sx-ink:#17243b;--sx-border:#ced8e3;color:var(--sx-ink);max-width:720px;margin:auto}.sx-widget *{box-sizing:border-box}.sx-card{border:1px solid var(--sx-border);border-radius:12px;padding:20px;margin:12px 0}.sx-btn{background:var(--sx-primary);color:white;border:0;border-radius:9px;padding:12px 17px;cursor:pointer;font:inherit}.sx-btn:disabled{opacity:.5;cursor:not-allowed}input,select{font:inherit;padding:9px;max-width:100%}label{display:block;margin:8px 0}a{color:var(--sx-primary)}:focus-visible{outline:3px solid #06b6d4;outline-offset:3px}</style>
</head><body><main class="sx-widget"><h1>Preinscripción a cursos</h1><section class="sx-card"><p>Vista previa sin envío a GHL: elige curso y genera un resumen local.</p><form id="sx-course-form"><label>Nombre <input name="name" required maxlength="100" autocomplete="name"></label><label>Correo <input name="email" type="email" required autocomplete="email"></label><label>Ruta <select name="course"><option>Inteligencia Artificial</option><option>Ecommerce</option><option>Marketing Digital</option></select></label><label><input type="checkbox" name="consent" required> Acepto ser contactado acerca de esta inscripción</label><button class="sx-btn">Previsualizar registro</button></form><output id="sx-preview" aria-live="polite"></output></section></main><script>\n(function(){document.getElementById('sx-course-form').addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget;if(!f.reportValidity())return;const x=new FormData(f);document.getElementById('sx-preview').textContent='Registro de prueba: '+x.get('name')+' / '+x.get('course')+' — aún NO enviado a GHL.';});})();\n</script></body></html>
