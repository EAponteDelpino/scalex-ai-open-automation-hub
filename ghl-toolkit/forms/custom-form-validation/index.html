<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScaleX AI | Validación de formularios</title>
<!-- Demo: when pasted in GHL, include assets/scalex.css and assets/scalex.js first -->
<style>.sx-widget{font:16px/1.5 system-ui,sans-serif;--sx-primary:#1479e6;--sx-ink:#17243b;--sx-border:#ced8e3;color:var(--sx-ink);max-width:720px;margin:auto}.sx-widget *{box-sizing:border-box}.sx-card{border:1px solid var(--sx-border);border-radius:12px;padding:20px;margin:12px 0}.sx-btn{background:var(--sx-primary);color:white;border:0;border-radius:9px;padding:12px 17px;cursor:pointer;font:inherit}.sx-btn:disabled{opacity:.5;cursor:not-allowed}input,select{font:inherit;padding:9px;max-width:100%}label{display:block;margin:8px 0}a{color:var(--sx-primary)}:focus-visible{outline:3px solid #06b6d4;outline-offset:3px}</style>
</head><body><main class="sx-widget"><h1>Validación de formularios</h1><section class="sx-card"><form id="sx-validate" novalidate><label>Nombre <input name="name" required minlength="2" maxlength="80"></label><label>Email <input name="email" type="email" required></label><label>Teléfono <input name="phone" type="tel" pattern="[+0-9 ]{8,20}" required></label><button class="sx-btn">Validar datos</button></form><p id="sx-feedback" role="alert"></p></section></main><script>\n(function(){const f=document.getElementById('sx-validate'),o=document.getElementById('sx-feedback');f.addEventListener('submit',e=>{e.preventDefault();if(!f.checkValidity()){o.textContent='Revisa los campos marcados.';f.reportValidity();return;}o.textContent='Validación de navegador correcta. Falta la validación del servidor y la integración con el CRM.';});})();\n</script></body></html>
