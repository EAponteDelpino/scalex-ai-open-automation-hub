<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScaleX AI | Captura de parámetros UTM</title>
<!-- Demo: when pasted in GHL, include assets/scalex.css and assets/scalex.js first -->
<style>.sx-widget{font:16px/1.5 system-ui,sans-serif;--sx-primary:#1479e6;--sx-ink:#17243b;--sx-border:#ced8e3;color:var(--sx-ink);max-width:720px;margin:auto}.sx-widget *{box-sizing:border-box}.sx-card{border:1px solid var(--sx-border);border-radius:12px;padding:20px;margin:12px 0}.sx-btn{background:var(--sx-primary);color:white;border:0;border-radius:9px;padding:12px 17px;cursor:pointer;font:inherit}.sx-btn:disabled{opacity:.5;cursor:not-allowed}input,select{font:inherit;padding:9px;max-width:100%}label{display:block;margin:8px 0}a{color:var(--sx-primary)}:focus-visible{outline:3px solid #06b6d4;outline-offset:3px}</style>
</head><body><main class="sx-widget"><h1>Captura de parámetros UTM</h1><section class="sx-card"><p>Extrae los parámetros de la URL actual y los coloca en campos ocultos. Asegúrate de asociarlos con campos del formulario nativo en GHL; sin esa asociación no hay captura CRM.</p><form id="sx-attribution"><input type="hidden" name="utm_source"><input type="hidden" name="utm_medium"><input type="hidden" name="utm_campaign"><button class="sx-btn">Ver etiquetas detectadas</button></form><pre id="sx-utms" aria-live="polite"></pre></section></main><script>\n(function(){const form=document.getElementById('sx-attribution'),q=new URLSearchParams(location.search);for(const k of ['utm_source','utm_medium','utm_campaign'])form.elements[k].value=(q.get(k)||'').slice(0,200);form.addEventListener('submit',e=>{e.preventDefault();document.getElementById('sx-utms').textContent=JSON.stringify(Object.fromEntries(new FormData(form)),null,2);});})();\n</script></body></html>
