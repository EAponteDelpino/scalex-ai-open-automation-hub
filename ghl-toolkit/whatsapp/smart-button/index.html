<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScaleX AI | Botón inteligente de WhatsApp</title>
<!-- Demo: when pasted in GHL, include assets/scalex.css and assets/scalex.js first -->
<style>.sx-widget{font:16px/1.5 system-ui,sans-serif;--sx-primary:#1479e6;--sx-ink:#17243b;--sx-border:#ced8e3;color:var(--sx-ink);max-width:720px;margin:auto}.sx-widget *{box-sizing:border-box}.sx-card{border:1px solid var(--sx-border);border-radius:12px;padding:20px;margin:12px 0}.sx-btn{background:var(--sx-primary);color:white;border:0;border-radius:9px;padding:12px 17px;cursor:pointer;font:inherit}.sx-btn:disabled{opacity:.5;cursor:not-allowed}input,select{font:inherit;padding:9px;max-width:100%}label{display:block;margin:8px 0}a{color:var(--sx-primary)}:focus-visible{outline:3px solid #06b6d4;outline-offset:3px}</style>
</head><body><main class="sx-widget"><h1>Botón inteligente de WhatsApp</h1><section class="sx-card"><label>Nombre <input id="sx-name" autocomplete="name" maxlength="80"></label><label>Interés <select id="sx-topic"><option>Curso IA</option><option>Ecommerce</option><option>Consultoría</option></select></label><a class="sx-btn" id="sx-wa" href="#" target="_blank" rel="noopener noreferrer">Abrir mensaje en WhatsApp</a><p><small>No envía mensajes automáticamente. Sustituye el número ficticio con tu WhatsApp empresarial.</small></p></section></main><script>
(function(){const phone='573001234567',name=document.getElementById('sx-name'),topic=document.getElementById('sx-topic'),link=document.getElementById('sx-wa');function update(){const message='Hola, soy '+(name.value.trim()||'un visitante')+'. Me interesa '+topic.value+'. ¿Puedes darme información?';link.href='https://wa.me/'+phone+'?text='+encodeURIComponent(message);}name.addEventListener('input',update);topic.addEventListener('change',update);update();})();
</script></body></html>
