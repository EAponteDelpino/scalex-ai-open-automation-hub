name: Offline starter checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  structural-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate n8n catalog and agent templates
        run: python -m unittest discover -s tests -v
      - name: Validate GHL example structure and webhook HMAC helper
        run: python -m unittest discover -s ghl-toolkit/tests -v
