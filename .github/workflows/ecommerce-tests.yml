name: Ecommerce Toolkit Tests
on:
  pull_request:
    paths:
      - 'ecommerce-toolkit/**'
      - '.github/workflows/ecommerce-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ecommerce-toolkit/**'
      - '.github/workflows/ecommerce-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test ecommerce formulas
        run: cd ecommerce-toolkit && npm test
