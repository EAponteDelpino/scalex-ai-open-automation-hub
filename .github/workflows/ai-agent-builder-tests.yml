name: AI Agent Builder Toolkit Tests
on:
  pull_request:
    paths:
      - 'ai-agent-builder/**'
      - '.github/workflows/ai-agent-builder-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ai-agent-builder/**'
      - '.github/workflows/ai-agent-builder-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd ai-agent-builder && npm test
